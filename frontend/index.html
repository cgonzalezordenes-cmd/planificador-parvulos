<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificador Parvularia — Medio Menor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a1a2e; min-height: 100vh; }

header { background: #185FA5; color: white; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 17px; font-weight: 600; }
header p  { font-size: 12px; opacity: 0.75; margin-top: 2px; }

.top-bar { background: white; border-bottom: 1px solid #e2e8f0; padding: 14px 24px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; color: #64748b; font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; }
.field input, .field select { padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 13px; color: #1a1a2e; background: #f8fafc; min-width: 160px; }
.field input:focus, .field select:focus { outline: none; border-color: #185FA5; background: white; }

/* MATRIZ */
.matrix-wrap { overflow-x: auto; padding: 24px; }
.matrix { display: grid; grid-template-columns: 100px repeat(5, 1fr); gap: 0; min-width: 900px; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

.cell { background: white; border: 0.5px solid #e2e8f0; padding: 12px; }
.cell.row-header { background: #185FA5; color: white; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; writing-mode: vertical-rl; text-orientation: mixed; }
.cell.col-header { background: #185FA5; color: white; text-align: center; font-size: 13px; font-weight: 600; padding: 14px; }
.cell.corner     { background: #0C447C; }

/* TEMA */
.tema-input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; background: #f8fafc; }
.tema-input:focus { outline: none; border-color: #185FA5; background: white; }
.btn-sugerir { margin-top: 8px; width: 100%; padding: 7px; background: #1D9E75; color: white; border: none; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
.btn-sugerir:hover { background: #0F6E56; }
.btn-sugerir:disabled { background: #94a3b8; cursor: not-allowed; }

/* IDEAS CHIPS */
.ideas-area { min-height: 80px; }
.ideas-loading { font-size: 11px; color: #185FA5; display: flex; align-items: center; gap: 6px; padding: 8px 0; }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #B5D4F4; border-top-color: #185FA5; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

.chip-wrap { position: relative; margin-bottom: 6px; }
.chip { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: 20px; border: 1.5px solid #cbd5e1; font-size: 12px; cursor: pointer; background: white; color: #334155; transition: all 0.2s; user-select: none; }
.chip:hover { border-color: #185FA5; background: #EFF6FF; }
.chip.selected { background: #185FA5; color: white; border-color: #185FA5; }
.chip.disabled { opacity: 0.35; cursor: default; pointer-events: none; }
.chip-title { flex: 1; font-weight: 500; }
.chip-toggle { font-size: 10px; opacity: 0.7; margin-left: 6px; transition: transform 0.2s; }
.chip.open .chip-toggle { transform: rotate(180deg); }

.chip-desc { display: none; background: #F8FAFC; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; font-size: 11px; color: #475569; line-height: 1.5; margin-top: 3px; }
.chip-desc.open { display: block; }

.ideas-hint { font-size: 10px; color: #94a3b8; margin-top: 4px; }
.ideas-count { font-size: 10px; font-weight: 600; color: #185FA5; margin-bottom: 4px; }

/* OA / OAT SELECT */
.oa-select-wrap { position: relative; }
.oa-select { width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 11px; background: #f8fafc; color: #334155; appearance: none; cursor: pointer; }
.oa-select:focus { outline: none; border-color: #185FA5; }
.oa-auto-badge { display: inline-block; margin-top: 4px; font-size: 10px; padding: 2px 8px; background: #EFF6FF; color: #185FA5; border-radius: 10px; }

/* BOTONES INFERIORES */
.action-bar { padding: 0 24px 24px; display: flex; gap: 12px; flex-wrap: wrap; }
.btn { padding: 11px 22px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 7px; }
.btn-primary { background: #185FA5; color: white; }
.btn-primary:hover { background: #0C447C; }
.btn-green   { background: #1D9E75; color: white; }
.btn-green:hover   { background: #0F6E56; }
.btn-purple  { background: #534AB7; color: white; }
.btn-purple:hover  { background: #3C3489; }
  .btn-orange  { background: #C05621; color: white; }
  .btn-orange:hover  { background: #9C4221; }
.btn:disabled { background: #94a3b8; cursor: not-allowed; }

/* STATUS */
.status-bar { margin: 0 24px 16px; padding: 13px 16px; border-radius: 10px; font-size: 13px; display: none; }
.status-bar.loading { background: #EFF6FF; color: #185FA5; border: 1px solid #B5D4F4; display: block; }
.status-bar.error   { background: #FEF2F2; color: #A32D2D; border: 1px solid #F7C1C1; display: block; }
.status-bar.success { background: #E1F5EE; color: #085041; border: 1px solid #9FE1CB; display: block; }

/* PREVIEW */
.preview-wrap { margin: 0 24px 24px; background: white; border-radius: 12px; border: 2px solid #1D9E75; padding: 20px; display: none; }
.preview-wrap h2 { font-size: 14px; font-weight: 600; color: #1D9E75; margin-bottom: 14px; }
.preview-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.preview-tab { padding: 5px 14px; border-radius: 16px; border: 1px solid #cbd5e1; font-size: 12px; cursor: pointer; background: white; color: #64748b; }
.preview-tab.active { background: #1D9E75; color: white; border-color: #1D9E75; }
.preview-panel { display: none; }
.preview-panel.active { display: block; }
.preview-day { border-left: 3px solid #ADDB7B; padding-left: 14px; }
.preview-day h3 { font-size: 13px; font-weight: 600; color: #185FA5; margin-bottom: 8px; }
.pf { margin-bottom: 5px; font-size: 12px; line-height: 1.6; }
.pf strong { color: #334155; }
.fam-block { padding: 7px 10px; background: #E1F5EE; border-radius: 6px; margin-bottom: 4px; font-size: 12px; line-height: 1.6; }
.dl-row { display: flex; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid #e2e8f0; flex-wrap: wrap; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Planificador Co-construido y Diversificado</h1>
    <p>Educación Parvularia · Nivel Medio Menor · Bases Curriculares 2018</p>
  </div>
</header>

<!-- Barra superior: datos generales + fechas -->
<div class="top-bar">
  <div class="field"><label>Educadora</label><input type="text" id="educadora" value="Giovanna Marino"></div>
  <div class="field"><label>Técnicos</label><input type="text" id="tecnicos" value="Carol Miranda – Helen Oyarzún"></div>
  <div class="field"><label>Desde (Lunes)</label><input type="date" id="fecha-inicio"></div>
  <div class="field"><label>Hasta (Viernes)</label><input type="date" id="fecha-fin"></div>
</div>

<!-- MATRIZ -->
<div class="matrix-wrap">
  <div class="matrix" id="matrix"></div>
</div>

<!-- Botón generar -->
<div class="action-bar">
  <button class="btn btn-primary" onclick="generarPreview()" id="btn-gen">
    Generar planificación con IA
  </button>
</div>

<div class="status-bar" id="status-gen"></div>

<!-- Preview -->
<div class="preview-wrap" id="preview-wrap">
  <h2>Vista previa — Revisa antes de descargar</h2>
  <div class="preview-tabs" id="preview-tabs"></div>
  <div id="preview-panels"></div>
  <div class="dl-row">
    <button class="btn btn-green"  onclick="descargar('planificacion')" id="btn-plan">Descargar Planificación .docx</button>
    <button class="btn btn-purple" onclick="descargar('familia')"       id="btn-fam">Descargar Info Familia .docx</button>
  </div>
  <div class="status-bar" id="status-dl" style="margin:12px 0 0"></div>
</div>

<script>
const API = 'https://planificador-parvulos.azurewebsites.net/api';

const OA_BANK = {
  DPS: {
    "Identidad y Autonomía": [
      {num:"OA 1", texto:"Representar verbal y corporalmente diferentes emociones y sentimientos, en sus juegos."},
      {num:"OA 4", texto:"Manifestar disposición para regular sus emociones en función de las necesidades propias y de los demás."},
      {num:"OA 5", texto:"Manifestar sus preferencias cuando participa o solicita participar, en diversas situaciones cotidianas y juegos."},
      {num:"OA 6", texto:"Actuar con progresiva independencia, ampliando su repertorio de acciones acorde a sus necesidades e intereses."},
      {num:"OA 7", texto:"Comunicar algunos rasgos de su identidad, como su nombre, características corporales, género y otros."},
      {num:"OA 9", texto:"Manifestar progresiva independencia en prácticas de alimentación, higiene corporal, bucal y evacuación."},
      {num:"OA 10", texto:"Manifestar satisfacción y confianza por su autovalía, comunicando algunos desafíos alcanzados."},
    ],
    "Convivencia y Ciudadanía": [
      {num:"OA 1", texto:"Participar en actividades y juegos grupales con sus pares, conversando, intercambiando pertenencias, cooperando."},
      {num:"OA 3", texto:"Colaborar en situaciones cotidianas y de juego, proponiendo acciones simples frente a necesidades de sus pares."},
      {num:"OA 6", texto:"Manifestar disposición para practicar acuerdos de convivencia básica que regulan situaciones cotidianas."},
      {num:"OA 8", texto:"Reconocer acciones correctas e incorrectas para la convivencia armónica del grupo."},
      {num:"OA 10", texto:"Manifestar interés para interactuar con niños y niñas, reconociendo la diversidad de sus características."},
    ],
    "Corporalidad y Movimiento": [
      {num:"OA 2", texto:"Reconocer las principales partes, características físicas de su cuerpo y sus funciones."},
      {num:"OA 3", texto:"Experimentar diversas posibilidades de acción con su cuerpo."},
      {num:"OA 5", texto:"Perfeccionar su coordinación visomotriz fina, a través del uso de diversos objetos, juguetes y utensilios."},
      {num:"OA 6", texto:"Adquirir control y equilibrio en movimientos, posturas y desplazamientos."},
      {num:"OA 7", texto:"Resolver desafíos prácticos en situaciones cotidianas y juegos, incorporando mayor precisión y coordinación."},
    ]
  },
  CI: {
    "Lenguaje Verbal": [
      {num:"OA 1", texto:"Expresarse oralmente, empleando estructuras oracionales simples y respetando patrones gramaticales básicos."},
      {num:"OA 2", texto:"Comprender mensajes simples como instrucciones explícitas, explicaciones y preguntas."},
      {num:"OA 4", texto:"Incorporar progresivamente nuevas palabras al comunicar oralmente temas variados de su interés."},
      {num:"OA 6", texto:"Comprender, a partir de la escucha atenta, contenidos explícitos de textos literarios y no literarios."},
    ],
    "Lenguajes Artísticos": [
      {num:"OA 3", texto:"Interpretar canciones y juegos musicales, experimentando con diversos recursos (voz, cuerpo, instrumentos)."},
      {num:"OA 4", texto:"Expresar corporalmente sensaciones y emociones experimentando con mímica, juegos teatrales, rondas y danzas."},
      {num:"OA 5", texto:"Expresar emociones, ideas y experiencias por medio de la plástica experimentando con recursos pictóricos y de modelado."},
      {num:"OA 7", texto:"Representar a través del dibujo diversos elementos de su entorno, incorporando figuras cerradas y primeros esbozos de la figura humana."},
    ]
  },
  ICE: {
    "Exploración del Entorno Natural": [
      {num:"OA 1", texto:"Manifestar interés y asombro por diversos elementos, situaciones y fenómenos del entorno natural."},
      {num:"OA 2", texto:"Comunicar verbalmente características de elementos y paisajes de su entorno natural."},
      {num:"OA 4", texto:"Comunicar algunas propiedades básicas de los elementos naturales que explora (colores, texturas, tamaños)."},
      {num:"OA 5", texto:"Distinguir una variedad de animales y plantas respecto a sus características, necesidades básicas y lugares que habitan."},
      {num:"OA 6", texto:"Colaborar en acciones que contribuyen al desarrollo de ambientes sostenibles."},
    ],
    "Comprensión del Entorno Sociocultural": [
      {num:"OA 1", texto:"Describir actividades habituales de su comunidad (ir de compras, jugar en la plaza, viajar en bus)."},
      {num:"OA 4", texto:"Reconocer sucesos significativos de su historia personal y familiar."},
      {num:"OA 6", texto:"Identificar algunas normas de protección y seguridad de su entorno cotidiano."},
    ],
    "Pensamiento Matemático": [
      {num:"OA 1", texto:"Reproducir patrones sonoros, visuales, gestuales, corporales u otros, de dos o tres elementos."},
      {num:"OA 5", texto:"Emplear cuantificadores tales como más/menos, mucho/poco, todo/ninguno, al comparar cantidades de objetos."},
      {num:"OA 6", texto:"Emplear progresivamente los números para contar, identificar, cuantificar y comparar cantidades hasta el 10."},
    ]
  }
};

const OAT_LIST = [
  {num:"IA OA 4", texto:"Manifestar disposición para regular sus emociones.", nucleo:"Identidad y Autonomía"},
  {num:"IA OA 5", texto:"Manifestar sus preferencias en situaciones cotidianas y juegos.", nucleo:"Identidad y Autonomía"},
  {num:"CC OA 1", texto:"Participar en actividades grupales, conversando y cooperando.", nucleo:"Convivencia y Ciudadanía"},
  {num:"CC OA 6", texto:"Practicar acuerdos de convivencia básica.", nucleo:"Convivencia y Ciudadanía"},
  {num:"CC OA 8", texto:"Reconocer acciones correctas e incorrectas para la convivencia.", nucleo:"Convivencia y Ciudadanía"},
  {num:"CC OA 10", texto:"Interactuar con niños/as reconociendo la diversidad.", nucleo:"Convivencia y Ciudadanía"},
  {num:"CM OA 3", texto:"Experimentar diversas posibilidades de acción con su cuerpo.", nucleo:"Corporalidad y Movimiento"},
];

const DIAS      = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
const DIAS_KEYS = ['lunes','martes','miercoles','jueves','viernes'];
const AMBITOS   = {DPS:'Desarrollo Personal y Social', CI:'Comunicación Integral', ICE:'Interacción y Comprensión del Entorno'};

// Estado por día
const state = DIAS.map(() => ({
  ideas: [],          // [{titulo, descripcion}]
  seleccionadas: [],  // indices seleccionados (max 3)
  oa: null,
  oat: null
}));

let aiData = null;

// ── Construir matriz ──
function buildMatrix() {
  const matrix = document.getElementById('matrix');
  matrix.innerHTML = '';

  // Fila 0: corner + headers días
  matrix.appendChild(mkCell('corner', ''));
  DIAS.forEach(d => {
    const c = mkCell('col-header', d);
    matrix.appendChild(c);
  });

  // Fila 1: TEMA
  matrix.appendChild(mkCell('row-header', 'Tema'));
  DIAS.forEach((d, i) => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.innerHTML = `
      <input class="tema-input" id="tema-${i}" placeholder="Ej: Hábitos de higiene" />
      <button class="btn-sugerir" id="btn-sug-${i}" onclick="sugerirIdeas(${i})">
        Sugerir ideas
      </button>`;
    matrix.appendChild(c);
  });

  // Fila 2: IDEAS
  matrix.appendChild(mkCell('row-header', 'Ideas'));
  DIAS.forEach((d, i) => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.id = `ideas-cell-${i}`;
    c.innerHTML = `<div class="ideas-area" id="ideas-area-${i}">
      <div style="font-size:11px;color:#94a3b8">Ingresa un tema y presiona "Sugerir ideas"</div>
    </div>`;
    matrix.appendChild(c);
  });

  // Fila 3: ÁMBITO + OA
  matrix.appendChild(mkCell('row-header', 'OA'));
  DIAS.forEach((d, i) => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.innerHTML = `
      <div class="field" style="margin-bottom:8px">
        <label>Ámbito</label>
        <select class="oa-select" id="ambito-${i}" onchange="renderOASelect(${i})">
          <option value="DPS">Desarrollo Personal y Social</option>
          <option value="CI">Comunicación Integral</option>
          <option value="ICE">Interacción y Comprensión del Entorno</option>
        </select>
      </div>
      <div class="field">
        <label>OA</label>
        <select class="oa-select" id="oa-select-${i}" onchange="setOA(${i})">
          <option value="">— IA elige automáticamente —</option>
        </select>
      </div>
      <span class="oa-auto-badge" id="oa-badge-${i}">Auto IA</span>`;
    matrix.appendChild(c);
    setTimeout(() => renderOASelect(i), 0);
  });

  // Fila 4: OAT
  matrix.appendChild(mkCell('row-header', 'OAT'));
  DIAS.forEach((d, i) => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.innerHTML = `
      <div class="field">
        <label>OAT</label>
        <select class="oa-select" id="oat-select-${i}" onchange="setOAT(${i})">
          <option value="">— IA elige automáticamente —</option>
          ${OAT_LIST.map((o,j) => `<option value="${j}">${o.num}: ${o.texto.substring(0,40)}...</option>`).join('')}
        </select>
      </div>
      <span class="oa-auto-badge" id="oat-badge-${i}">Auto IA</span>`;
    matrix.appendChild(c);
  });
}

function mkCell(cls, text) {
  const c = document.createElement('div');
  c.className = `cell ${cls}`;
  c.textContent = text;
  return c;
}

function renderOASelect(day) {
  const ambitoKey = document.getElementById(`ambito-${day}`).value;
  const nucleos   = OA_BANK[ambitoKey];
  const sel       = document.getElementById(`oa-select-${day}`);
  sel.innerHTML   = '<option value="">— IA elige automáticamente —</option>';
  Object.entries(nucleos).forEach(([nucleo, oas]) => {
    const grp = document.createElement('optgroup');
    grp.label = nucleo;
    oas.forEach((oa, j) => {
      const opt = document.createElement('option');
      opt.value = `${ambitoKey}||${nucleo}||${oa.num}||${oa.texto}`;
      opt.textContent = `${oa.num}: ${oa.texto.substring(0,50)}...`;
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });
  state[day].oa = null;
  updateOABadge(day);
}

function setOA(day) {
  const val = document.getElementById(`oa-select-${day}`).value;
  if (!val) { state[day].oa = null; }
  else {
    const p = val.split('||');
    state[day].oa = {ambito: AMBITOS[p[0]], nucleo: p[1], num: p[2], texto: p[3]};
  }
  updateOABadge(day);
  aiData = null;
}

function setOAT(day) {
  const val = document.getElementById(`oat-select-${day}`).value;
  state[day].oat = val === '' ? null : OAT_LIST[parseInt(val)];
  updateOATBadge(day);
  aiData = null;
}

function updateOABadge(day) {
  const badge = document.getElementById(`oa-badge-${day}`);
  badge.style.display = state[day].oa ? 'none' : 'inline-block';
}

function updateOATBadge(day) {
  const badge = document.getElementById(`oat-badge-${day}`);
  badge.style.display = state[day].oat ? 'none' : 'inline-block';
}

// ── Sugerir ideas para un día ──
async function sugerirIdeas(day) {
  const tema = document.getElementById(`tema-${day}`).value.trim();
  if (!tema) { alert('Ingresa primero el tema del día.'); return; }

  const btn  = document.getElementById(`btn-sug-${day}`);
  const area = document.getElementById(`ideas-area-${day}`);
  btn.disabled = true;
  area.innerHTML = `<div class="ideas-loading"><span class="spinner"></span> Generando ideas...</div>`;

  try {
    const res = await fetch(`${API}/suggest-ideas`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({tema, dia: DIAS[day]})
    });
    if (!res.ok) throw new Error(await res.text());
    const json = await res.json();
    state[day].ideas        = json.ideas;
    state[day].seleccionadas = [];
    renderIdeas(day);
  } catch(e) {
    area.innerHTML = `<div style="font-size:11px;color:#A32D2D">Error: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderIdeas(day) {
  const area = document.getElementById(`ideas-area-${day}`);
  const sel  = state[day].seleccionadas;
  const ideas = state[day].ideas;

  area.innerHTML = `<div class="ideas-count">${sel.length}/3 seleccionadas</div>`;

  ideas.forEach((idea, idx) => {
    const isSelected = sel.includes(idx);
    const isDisabled = !isSelected && sel.length >= 3;

    const wrap = document.createElement('div');
    wrap.className = 'chip-wrap';

    const chip = document.createElement('div');
    chip.className = `chip${isSelected ? ' selected' : ''}${isDisabled ? ' disabled' : ''}`;
    chip.innerHTML = `<span class="chip-title">${idea.titulo}</span><span class="chip-toggle">▾</span>`;

    const desc = document.createElement('div');
    desc.className = 'chip-desc';
    desc.textContent = idea.descripcion;

    // Toggle descripción
    chip.querySelector('.chip-toggle').addEventListener('click', (e) => {
      e.stopPropagation();
      chip.classList.toggle('open');
      desc.classList.toggle('open');
    });

    // Seleccionar chip
    chip.addEventListener('click', (e) => {
      if (e.target === chip.querySelector('.chip-toggle')) return;
      if (isDisabled) return;
      if (isSelected) {
        state[day].seleccionadas = sel.filter(i => i !== idx);
      } else {
        if (sel.length < 3) state[day].seleccionadas.push(idx);
      }
      aiData = null;
      renderIdeas(day);
    });

    wrap.appendChild(chip);
    wrap.appendChild(desc);
    area.appendChild(wrap);
  });

  if (sel.length < 3) {
    const hint = document.createElement('div');
    hint.className = 'ideas-hint';
    hint.textContent = `Selecciona ${3 - sel.length} idea${3 - sel.length > 1 ? 's' : ''} más`;
    area.appendChild(hint);
  }
}

// ── Construir form data ──
function getFormData() {
  const ambitos = {DPS:'Desarrollo Personal y Social', CI:'Comunicación Integral', ICE:'Interacción y Comprensión del Entorno'};
  return {
    educadora:    document.getElementById('educadora').value,
    tecnicos:     document.getElementById('tecnicos').value,
    fecha_inicio: document.getElementById('fecha-inicio').value,
    fecha_fin:    document.getElementById('fecha-fin').value,
    dias: DIAS.map((nombre, i) => {
      const ambitoKey = document.getElementById(`ambito-${i}`).value;
      const ideas_sel = state[i].seleccionadas.map(idx => state[i].ideas[idx]);
      return {
        nombre,
        tema:         document.getElementById(`tema-${i}`).value,
        ambito:       ambitos[ambitoKey],
        ideas:        ideas_sel,
        oa:           state[i].oa,
        oat:          state[i].oat,
        oa_auto:      !state[i].oa,
        oat_auto:     !state[i].oat
      };
    })
  };
}

function validate() {
  const data = getFormData();
  if (!data.fecha_inicio || !data.fecha_fin) return 'Selecciona las fechas de la semana.';
  for (let i = 0; i < 5; i++) {
    if (!data.dias[i].tema) return `Falta el tema del ${DIAS[i]}.`;
    if (state[i].ideas.length > 0 && state[i].seleccionadas.length < 3)
      return `Selecciona 3 ideas para el ${DIAS[i]} (tienes ${state[i].seleccionadas.length}).`;
  }
  return null;
}

// ── Generar preview ──
async function generarPreview() {
  const err = validate();
  if (err) { showStatus('status-gen','error', err); return; }

  const form = getFormData();
  document.getElementById('btn-gen').disabled = true;
  showStatus('status-gen','loading','<span class="spinner"></span> Generando planificación con IA...');
  document.getElementById('preview-wrap').style.display = 'none';

  try {
    const res = await fetch(`${API}/generate`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(form)
    });
    if (!res.ok) throw new Error(await res.text());
    const json = await res.json();
    aiData = json.data;
    renderPreview(form, aiData);
    showStatus('status-gen','success','Contenido generado. Revisa y descarga.');
  } catch(e) {
    showStatus('status-gen','error','Error: ' + e.message);
  } finally {
    document.getElementById('btn-gen').disabled = false;
  }
}

function renderPreview(form, ai) {
  const wrap    = document.getElementById('preview-wrap');
  const tabsEl  = document.getElementById('preview-tabs');
  const panelEl = document.getElementById('preview-panels');
  tabsEl.innerHTML = ''; panelEl.innerHTML = '';

  DIAS.forEach((nombre, i) => {
    const key = DIAS_KEYS[i];
    const d   = ai[key] || {};
    const fd  = form.dias[i];

    const tab = document.createElement('div');
    tab.className = 'preview-tab' + (i === 0 ? ' active' : '');
    tab.textContent = nombre;
    tab.onclick = () => {
      tabsEl.querySelectorAll('.preview-tab').forEach((t,j)   => t.classList.toggle('active', j === i));
      panelEl.querySelectorAll('.preview-panel').forEach((p,j) => p.classList.toggle('active', j === i));
    };
    tabsEl.appendChild(tab);

    const oaText  = fd.oa  ? `${fd.oa.num} — ${fd.oa.texto}`   : `${d.oa_asignado || 'IA asignó automáticamente'}`;
    const oatText = fd.oat ? `${fd.oat.num} — ${fd.oat.texto}` : `${d.oat_asignado || 'IA asignó automáticamente'}`;

    const panel = document.createElement('div');
    panel.className = 'preview-panel' + (i === 0 ? ' active' : '');
    panel.innerHTML = `
      <div class="preview-day">
        <h3>${d.titulo_dia || nombre + ': ' + fd.tema}</h3>
        <div class="pf"><strong>OA:</strong> ${oaText}</div>
        <div class="pf"><strong>OAT:</strong> ${oatText}</div>
        <div class="pf" style="margin-top:8px"><strong>Inicio:</strong> ${d.inicio||''}</div>
        <div class="pf"><strong>E1 — ${d.escenario_1_titulo||''}:</strong> ${d.escenario_1_desc||''}</div>
        <div class="pf"><strong>E2 — ${d.escenario_2_titulo||''}:</strong> ${d.escenario_2_desc||''}</div>
        <div class="pf"><strong>E3 — ${d.escenario_3_titulo||''}:</strong> ${d.escenario_3_desc||''}</div>
        <div class="pf" style="margin-top:8px"><strong>Ind. OA 1:</strong> ${d.indicador_oa1||''}</div>
        <div class="pf"><strong>Ind. OA 2:</strong> ${d.indicador_oa2||''}</div>
        <div class="pf"><strong>Ind. OAT:</strong> ${d.indicador_oat||''}</div>
        <div style="margin-top:10px">
          <div class="fam-block"><strong>¿Qué harán los niños?</strong> ${d.que_haran_ninos||''}</div>
          <div class="fam-block"><strong>¿Qué harán las familias?</strong> ${d.que_haran_familias||''}</div>
          <div class="fam-block"><strong>¿Qué necesitamos?</strong> ${d.que_necesitamos||''}</div>
        </div>
      </div>`;
    panelEl.appendChild(panel);
  });

  wrap.style.display = 'block';
  wrap.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Descargar ──
async function descargar(tipo) {
  if (!aiData) { showStatus('status-dl','error','Primero genera el contenido.'); return; }
  const form     = getFormData();
  const btnId    = tipo === 'planificacion' ? 'btn-plan' : tipo === 'familia' ? 'btn-fam' : 'btn-eval';
  const endpoint = tipo === 'planificacion' ? 'download-planificacion' : tipo === 'familia' ? 'download-familia' : 'download-evaluacion';
  const filename = tipo === 'planificacion'
    ? `Planificacion_${form.fecha_inicio}.docx`
    : tipo === 'familia'
    ? `InfoFamilia_${form.fecha_inicio}.docx`
    : `Evaluacion_${form.fecha_inicio}.xlsx`;

  document.getElementById(btnId).disabled = true;
  const labels = {planificacion:'planificación', familia:'info familia', evaluacion:'evaluación'};
  showStatus('status-dl','loading',`<span class="spinner"></span> Generando ${labels[tipo]}...`);

  try {
    const res = await fetch(`${API}/${endpoint}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({form, ai: aiData})
    });
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    showStatus('status-dl','success',`${filename} descargado.`);
  } catch(e) {
    showStatus('status-dl','error','Error: ' + e.message);
  } finally {
    document.getElementById(btnId).disabled = false;
  }
}

function showStatus(id, type, msg) {
  const el = document.getElementById(id);
  el.className = `status-bar ${type}`;
  el.innerHTML = msg;
}

window.addEventListener('DOMContentLoaded', () => {
  buildMatrix();
  const hoy   = new Date();
  const lunes = new Date(hoy);
  lunes.setDate(hoy.getDate() - hoy.getDay() + 1);
  const viernes = new Date(lunes);
  viernes.setDate(lunes.getDate() + 4);
  document.getElementById('fecha-inicio').value = lunes.toISOString().split('T')[0];
  document.getElementById('fecha-fin').value    = viernes.toISOString().split('T')[0];
});
</script>
