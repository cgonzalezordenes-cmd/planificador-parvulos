<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificador Parvularia — Medio Menor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<style>
:root {
  --blue:        #185FA5;
  --blue-dark:   #0C447C;
  --blue-light:  #EFF6FF;
  --blue-muted:  #B5D4F4;
  --green:       #1D9E75;
  --green-dark:  #0F6E56;
  --green-light: #E1F5EE;
  --green-muted: #9FE1CB;
  --green-accent:#ADDB7B;
  --purple:      #534AB7;
  --purple-dark: #3C3489;
  --orange:      #C05621;
  --orange-dark: #9C4221;
  --red-light:   #FEF2F2;
  --red:         #A32D2D;
  --red-muted:   #F7C1C1;
  --slate-50:    #f8fafc;
  --slate-100:   #f1f5f9;
  --slate-200:   #e2e8f0;
  --slate-300:   #cbd5e1;
  --slate-500:   #64748b;
  --slate-600:   #475569;
  --slate-700:   #334155;
  --slate-900:   #1a1a2e;
  --disabled:    #94a3b8;
  --radius-sm:   7px;
  --radius-md:   10px;
  --radius-lg:   14px;
  --shadow-sm:   0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:   0 4px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #eef2f7; color: var(--slate-900); min-height: 100vh; }

/* ── HEADER ── */
header {
  background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 60%, #2176c4 100%);
  color: white;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(12,68,124,0.25);
}
.header-brand { display: flex; align-items: center; gap: 14px; }
.header-icon {
  width: 42px; height: 42px;
  background: rgba(255,255,255,0.18);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
header p  { font-size: 12px; opacity: 0.72; margin-top: 3px; }
.header-badge {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 500;
  opacity: 0.9;
}

/* ── TOP BAR ── */
.top-bar {
  background: white;
  border-bottom: 1px solid var(--slate-200);
  padding: 16px 32px;
  display: flex;
  gap: 20px;
  align-items: flex-end;
  flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}
.field { display: flex; flex-direction: column; gap: 5px; }
.field label {
  font-size: 10.5px;
  color: var(--slate-500);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.field input, .field select {
  padding: 8px 11px;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--slate-900);
  background: var(--slate-50);
  min-width: 170px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus, .field select:focus {
  outline: none;
  border-color: var(--blue);
  background: white;
  box-shadow: 0 0 0 3px rgba(24,95,165,0.1);
}

/* ── SECTION LABEL ── */
.section-label {
  padding: 16px 32px 0;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--slate-500);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--slate-200);
}

/* ── MATRIZ ── */
.matrix-wrap { overflow-x: auto; padding: 16px 32px 24px; }
.matrix {
  display: grid;
  grid-template-columns: 90px repeat(5, 1fr);
  gap: 0;
  min-width: 860px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--slate-200);
}

.cell { background: white; border: 1px solid #eef0f4; padding: 12px; }
.cell.row-header {
  background: linear-gradient(180deg, var(--blue) 0%, var(--blue-dark) 100%);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  border-color: rgba(255,255,255,0.1);
}
.cell.col-header {
  background: linear-gradient(180deg, var(--blue) 0%, var(--blue-dark) 100%);
  color: white;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  padding: 14px;
  letter-spacing: 0.2px;
  border-color: rgba(255,255,255,0.1);
}
.cell.corner { background: var(--blue-dark); }

/* ── TEMA INPUT ── */
.tema-input {
  width: 100%;
  padding: 8px 10px;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-sm);
  font-size: 13px;
  background: var(--slate-50);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.tema-input:focus {
  outline: none;
  border-color: var(--blue);
  background: white;
  box-shadow: 0 0 0 3px rgba(24,95,165,0.1);
}
.btn-sugerir {
  margin-top: 8px;
  width: 100%;
  padding: 7px 10px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background 0.15s, transform 0.1s;
}
.btn-sugerir:hover { background: var(--green-dark); transform: translateY(-1px); }
.btn-sugerir:active { transform: translateY(0); }
.btn-sugerir:disabled { background: var(--disabled); cursor: not-allowed; transform: none; }

/* ── CHIPS ── */
.ideas-area { min-height: 80px; }
.ideas-loading { font-size: 11px; color: var(--blue); display: flex; align-items: center; gap: 6px; padding: 8px 0; }
.spinner {
  display: inline-block;
  width: 13px; height: 13px;
  border: 2px solid var(--blue-muted);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

.chip-wrap { position: relative; margin-bottom: 6px; }
.chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 11px;
  border-radius: 20px;
  border: 1.5px solid var(--slate-300);
  font-size: 12px;
  cursor: pointer;
  background: white;
  color: var(--slate-700);
  transition: all 0.15s;
  user-select: none;
  box-shadow: var(--shadow-sm);
}
.chip:hover { border-color: var(--blue); background: var(--blue-light); box-shadow: 0 2px 6px rgba(24,95,165,0.12); }
.chip.selected {
  background: linear-gradient(135deg, var(--blue) 0%, #1e6fbf 100%);
  color: white;
  border-color: var(--blue);
  box-shadow: 0 2px 8px rgba(24,95,165,0.3);
}
.chip.disabled { opacity: 0.32; cursor: default; pointer-events: none; }
.chip-title { flex: 1; font-weight: 500; }
.chip-toggle { font-size: 10px; opacity: 0.65; margin-left: 6px; transition: transform 0.2s; }
.chip.open .chip-toggle { transform: rotate(180deg); }

.chip-desc {
  display: none;
  background: var(--slate-50);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-sm);
  padding: 8px 11px;
  font-size: 11px;
  color: var(--slate-600);
  line-height: 1.55;
  margin-top: 3px;
}
.chip-desc.open { display: block; }

.ideas-hint { font-size: 10px; color: var(--disabled); margin-top: 5px; font-style: italic; }
.ideas-count { font-size: 10px; font-weight: 700; color: var(--blue); margin-bottom: 5px; }

.manual-idea-row { display: flex; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--slate-200); }
.manual-idea-input {
  flex: 1;
  padding: 6px 9px;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-sm);
  font-size: 12px;
  background: var(--slate-50);
  color: var(--slate-900);
  min-width: 0;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.manual-idea-input:focus { outline: none; border-color: var(--blue); background: white; box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
.manual-idea-input::placeholder { color: var(--disabled); }
.btn-add-idea {
  padding: 6px 10px;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
}
.btn-add-idea:hover { background: var(--blue-dark); transform: translateY(-1px); }
.btn-add-idea:active { transform: translateY(0); }
.chip.manual { border-style: dashed; }
.chip.manual.selected { border-style: solid; }
.chip-delete { font-size: 10px; opacity: 0.55; margin-left: 6px; padding: 1px 3px; border-radius: 3px; transition: opacity 0.15s; }
.chip-delete:hover { opacity: 1; }
.chip.selected .chip-delete { opacity: 0.7; }
.chip.selected .chip-delete:hover { opacity: 1; }

/* ── OA SELECT ── */
.oa-select {
  width: 100%;
  padding: 7px 10px;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-sm);
  font-size: 11px;
  background: var(--slate-50);
  color: var(--slate-700);
  appearance: none;
  cursor: pointer;
  transition: border-color 0.15s;
}
.oa-select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
.oa-auto-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-top: 5px;
  font-size: 10px;
  padding: 2px 8px;
  background: var(--blue-light);
  color: var(--blue);
  border-radius: 10px;
  font-weight: 600;
}
.oa-auto-badge::before { content: '✦'; font-size: 8px; }

/* ── ACTION BAR ── */
.action-bar {
  padding: 0 32px 24px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.btn {
  padding: 11px 22px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  letter-spacing: 0.1px;
  box-shadow: var(--shadow-sm);
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn:active { transform: translateY(0); }
.btn-primary { background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%); color: white; }
.btn-primary:hover { background: linear-gradient(135deg, #1e6fbf 0%, var(--blue) 100%); }
.btn-green   { background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%); color: white; }
.btn-green:hover   { background: linear-gradient(135deg, #22b585 0%, var(--green) 100%); }
.btn-purple  { background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%); color: white; }
.btn-purple:hover  { background: linear-gradient(135deg, #6058d4 0%, var(--purple) 100%); }
.btn-orange  { background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%); color: white; }
.btn-orange:hover  { background: linear-gradient(135deg, #d4622a 0%, var(--orange) 100%); }
.btn:disabled { background: var(--disabled) !important; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── STATUS BAR ── */
.status-bar {
  margin: 0 32px 16px;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-size: 13px;
  display: none;
  align-items: center;
  gap: 8px;
}
.status-bar.loading { background: var(--blue-light); color: var(--blue); border: 1px solid var(--blue-muted); display: flex; }
.status-bar.error   { background: var(--red-light);  color: var(--red);  border: 1px solid var(--red-muted);  display: flex; }
.status-bar.success { background: var(--green-light); color: #085041;    border: 1px solid var(--green-muted); display: flex; }

/* ── PREVIEW ── */
.preview-wrap {
  margin: 0 32px 32px;
  background: white;
  border-radius: var(--radius-lg);
  border: 2px solid var(--green);
  padding: 22px 24px;
  display: none;
  box-shadow: var(--shadow-md);
}
.preview-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.preview-header-icon {
  width: 32px; height: 32px;
  background: var(--green-light);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.preview-wrap h2 { font-size: 14px; font-weight: 700; color: var(--green-dark); }
.preview-wrap .preview-subtitle { font-size: 11px; color: var(--slate-500); margin-top: 1px; }
.preview-tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.preview-tab {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--slate-200);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  background: var(--slate-50);
  color: var(--slate-500);
  transition: all 0.15s;
}
.preview-tab:hover { border-color: var(--green); color: var(--green-dark); background: var(--green-light); }
.preview-tab.active { background: var(--green); color: white; border-color: var(--green); box-shadow: 0 2px 6px rgba(29,158,117,0.3); }
.preview-panel { display: none; }
.preview-panel.active { display: block; }
.preview-day {
  border-left: 3px solid var(--green-accent);
  padding-left: 16px;
  background: var(--slate-50);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 14px 14px 14px 16px;
}
.preview-day h3 { font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 10px; }
.pf { margin-bottom: 6px; font-size: 12px; line-height: 1.65; }
.pf strong { color: var(--slate-700); }
.pf-section { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--slate-200); }
.fam-block {
  padding: 8px 12px;
  background: var(--green-light);
  border-radius: var(--radius-sm);
  margin-bottom: 5px;
  font-size: 12px;
  line-height: 1.65;
  border-left: 3px solid var(--green-muted);
}
.dl-row {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--slate-200);
  flex-wrap: wrap;
}
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-icon">📋</div>
    <div>
      <h1>Planificador Co-construido y Diversificado</h1>
      <p>Educación Parvularia · Nivel Medio Menor · Bases Curriculares 2018</p>
    </div>
  </div>
  <span class="header-badge">IA ✦ Groq</span>
</header>

<!-- Barra superior: datos generales + fechas -->
<div class="top-bar">
  <div class="field"><label>Educadora</label><input type="text" id="educadora" value="Giovanna Marino"></div>
  <div class="field"><label>Técnicos</label><input type="text" id="tecnicos" value="Carol Miranda – Helen Oyarzún"></div>
  <div class="field"><label>Desde (Lunes)</label><input type="date" id="fecha-inicio"></div>
  <div class="field"><label>Hasta (Viernes)</label><input type="date" id="fecha-fin"></div>
</div>

<!-- MATRIZ -->
<div class="section-label">Matriz semanal</div>
<div class="matrix-wrap">
  <div class="matrix" id="matrix"></div>
</div>

<!-- Botón generar -->
<div class="action-bar">
  <button class="btn btn-primary" onclick="generarPreview()" id="btn-gen">
    ✦ Generar planificación con IA
  </button>
</div>

<div class="status-bar" id="status-gen"></div>

<!-- Preview -->
<div class="preview-wrap" id="preview-wrap">
  <div class="preview-header">
    <div class="preview-header-icon">👁</div>
    <div>
      <h2>Vista previa</h2>
      <div class="preview-subtitle">Revisa el contenido antes de descargar</div>
    </div>
  </div>
  <div class="preview-tabs" id="preview-tabs"></div>
  <div id="preview-panels"></div>
  <div class="dl-row">
    <button class="btn btn-green"  onclick="descargar('planificacion')" id="btn-plan">📄 Planificación .docx</button>
    <button class="btn btn-purple" onclick="descargar('familia')"       id="btn-fam">👨‍👩‍👧 Info Familia .docx</button>
    <button class="btn btn-orange" onclick="descargar('evaluacion')"    id="btn-eval">📊 Evaluación .xlsx</button>
  </div>
  <div class="status-bar" id="status-dl" style="margin:12px 0 0"></div>
</div>

<script>
const API = 'https://planificador-parvulos.azurewebsites.net/api';

const DIAS      = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
const DIAS_KEYS = ['lunes','martes','miercoles','jueves','viernes'];

// Estado por día
const state = DIAS.map(() => ({
  ideas: [],         // [{titulo, descripcion}]
  seleccionadas: [], // indices seleccionados (max 3)
}));

let aiData = null;

// ── Construir matriz ──
function buildMatrix() {
  const matrix = document.getElementById('matrix');
  matrix.innerHTML = '';

  // Fila 0: corner + headers días
  matrix.appendChild(mkCell('corner', ''));
  DIAS.forEach(d => {
    const c = mkCell('col-header', d);
    matrix.appendChild(c);
  });

  // Fila 1: TEMA
  matrix.appendChild(mkCell('row-header', 'Tema'));
  DIAS.forEach((d, i) => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.innerHTML = `
      <input class="tema-input" id="tema-${i}" placeholder="Ej: Hábitos de higiene" />
      <button class="btn-sugerir" id="btn-sug-${i}" onclick="sugerirIdeas(${i})">
        Sugerir ideas
      </button>`;
    matrix.appendChild(c);
  });

  // Fila 2: IDEAS
  matrix.appendChild(mkCell('row-header', 'Ideas'));
  DIAS.forEach((d, i) => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.id = `ideas-cell-${i}`;
    c.innerHTML = `<div class="ideas-area" id="ideas-area-${i}">
      <div style="font-size:11px;color:#94a3b8">Ingresa un tema y presiona "Sugerir ideas"</div>
    </div>
    <div class="manual-idea-row">
      <input class="manual-idea-input" id="manual-idea-${i}" placeholder="Agregar idea propia…" />
      <button class="btn-add-idea" onclick="agregarIdeaManual(${i})" title="Agregar idea">+</button>
    </div>`;
    matrix.appendChild(c);
  });

}

function mkCell(cls, text) {
  const c = document.createElement('div');
  c.className = `cell ${cls}`;
  c.textContent = text;
  return c;
}

// ── Agregar idea manual ──
function agregarIdeaManual(day) {
  const input = document.getElementById(`manual-idea-${day}`);
  const texto = input.value.trim();
  if (!texto) return;
  state[day].ideas.push({ titulo: texto, descripcion: '', manual: true });
  input.value = '';
  input.focus();
  aiData = null;
  renderIdeas(day);
}

// Permitir Enter en el input manual
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const m = e.target.id && e.target.id.match(/^manual-idea-(\d+)$/);
  if (m) agregarIdeaManual(parseInt(m[1]));
});

// ── Sugerir ideas para un día ──
async function sugerirIdeas(day) {
  const tema = document.getElementById(`tema-${day}`).value.trim();
  if (!tema) { alert('Ingresa primero el tema del día.'); return; }

  const btn  = document.getElementById(`btn-sug-${day}`);
  const area = document.getElementById(`ideas-area-${day}`);
  btn.disabled = true;
  area.innerHTML = `<div class="ideas-loading"><span class="spinner"></span> Generando ideas...</div>`;

  try {
    const res = await fetch(`${API}/suggest-ideas`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({tema, dia: DIAS[day]})
    });
    if (!res.ok) throw new Error(await res.text());
    const json = await res.json();
    state[day].ideas        = json.ideas;
    state[day].seleccionadas = [];
    renderIdeas(day);
  } catch(e) {
    area.innerHTML = `<div style="font-size:11px;color:#A32D2D">Error: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderIdeas(day) {
  const area  = document.getElementById(`ideas-area-${day}`);
  const sel   = state[day].seleccionadas;
  const ideas = state[day].ideas;

  area.innerHTML = ideas.length
    ? `<div class="ideas-count">${sel.length}/3 seleccionadas</div>`
    : `<div style="font-size:11px;color:#94a3b8">Ingresa un tema y presiona "Sugerir ideas", o agrega una idea propia.</div>`;

  ideas.forEach((idea, idx) => {
    const isSelected = sel.includes(idx);
    const isDisabled = !isSelected && sel.length >= 3;
    const isManual   = !!idea.manual;

    const wrap = document.createElement('div');
    wrap.className = 'chip-wrap';

    const chip = document.createElement('div');
    chip.className = `chip${isManual ? ' manual' : ''}${isSelected ? ' selected' : ''}${isDisabled ? ' disabled' : ''}`;

    if (isManual) {
      // Ideas manuales: sin toggle de descripción, con botón eliminar
      chip.innerHTML = `<span class="chip-title">${idea.titulo}</span><span class="chip-delete" title="Eliminar">✕</span>`;
      chip.querySelector('.chip-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        state[day].ideas = ideas.filter((_, i) => i !== idx);
        state[day].seleccionadas = sel.filter(i => i !== idx).map(i => i > idx ? i - 1 : i);
        aiData = null;
        renderIdeas(day);
      });
    } else {
      chip.innerHTML = `<span class="chip-title">${idea.titulo}</span><span class="chip-toggle">▾</span>`;
      const desc = document.createElement('div');
      desc.className = 'chip-desc';
      desc.textContent = idea.descripcion;
      chip.querySelector('.chip-toggle').addEventListener('click', (e) => {
        e.stopPropagation();
        chip.classList.toggle('open');
        desc.classList.toggle('open');
      });
      wrap.appendChild(desc);
    }

    chip.addEventListener('click', (e) => {
      if (e.target.classList.contains('chip-toggle') || e.target.classList.contains('chip-delete')) return;
      if (isDisabled) return;
      if (isSelected) {
        state[day].seleccionadas = sel.filter(i => i !== idx);
      } else {
        if (sel.length < 3) state[day].seleccionadas.push(idx);
      }
      aiData = null;
      renderIdeas(day);
    });

    wrap.insertBefore(chip, wrap.firstChild);
    area.appendChild(wrap);
  });

  if (ideas.length > 0 && sel.length < 3) {
    const hint = document.createElement('div');
    hint.className = 'ideas-hint';
    hint.textContent = `Selecciona ${3 - sel.length} idea${3 - sel.length > 1 ? 's' : ''} más`;
    area.appendChild(hint);
  }
}

// ── Construir form data ──
function getFormData() {
  return {
    educadora:    document.getElementById('educadora').value,
    tecnicos:     document.getElementById('tecnicos').value,
    fecha_inicio: document.getElementById('fecha-inicio').value,
    fecha_fin:    document.getElementById('fecha-fin').value,
    dias: DIAS.map((nombre, i) => ({
      nombre,
      tema:  document.getElementById(`tema-${i}`).value,
      ideas: state[i].seleccionadas.map(idx => state[i].ideas[idx]),
    }))
  };
}

function validate() {
  const data = getFormData();
  if (!data.fecha_inicio || !data.fecha_fin) return 'Selecciona las fechas de la semana.';
  for (let i = 0; i < 5; i++) {
    if (!data.dias[i].tema) return `Falta el tema del ${DIAS[i]}.`;
    if (state[i].ideas.length > 0 && state[i].seleccionadas.length < 3)
      return `Selecciona 3 ideas para el ${DIAS[i]} (tienes ${state[i].seleccionadas.length}).`;
  }
  return null;
}

// ── Generar preview ──
async function generarPreview() {
  const err = validate();
  if (err) { showStatus('status-gen','error', err); return; }

  const form = getFormData();
  document.getElementById('btn-gen').disabled = true;
  showStatus('status-gen','loading','<span class="spinner"></span> Generando planificación con IA...');
  document.getElementById('preview-wrap').style.display = 'none';

  try {
    const res = await fetch(`${API}/generate`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(form)
    });
    if (!res.ok) throw new Error(await res.text());
    const json = await res.json();
    aiData = json.data;
    renderPreview(form, aiData);
    showStatus('status-gen','success','Contenido generado. Revisa y descarga.');
  } catch(e) {
    showStatus('status-gen','error','Error: ' + e.message);
  } finally {
    document.getElementById('btn-gen').disabled = false;
  }
}

function renderPreview(form, ai) {
  const wrap    = document.getElementById('preview-wrap');
  const tabsEl  = document.getElementById('preview-tabs');
  const panelEl = document.getElementById('preview-panels');
  tabsEl.innerHTML = ''; panelEl.innerHTML = '';

  DIAS.forEach((nombre, i) => {
    const key = DIAS_KEYS[i];
    const d   = ai[key] || {};
    const fd  = form.dias[i];

    const tab = document.createElement('div');
    tab.className = 'preview-tab' + (i === 0 ? ' active' : '');
    tab.textContent = nombre;
    tab.onclick = () => {
      tabsEl.querySelectorAll('.preview-tab').forEach((t,j)   => t.classList.toggle('active', j === i));
      panelEl.querySelectorAll('.preview-panel').forEach((p,j) => p.classList.toggle('active', j === i));
    };
    tabsEl.appendChild(tab);

    const oaText  = d.oa_num  ? `${d.oa_num}: ${d.oa_texto}`   : '—';
    const oatText = d.oat_num ? `${d.oat_num}: ${d.oat_texto}` : '—';

    const panel = document.createElement('div');
    panel.className = 'preview-panel' + (i === 0 ? ' active' : '');
    panel.innerHTML = `
      <div class="preview-day">
        <h3>${d.titulo_dia || nombre + ': ' + fd.tema}</h3>
        <div class="pf"><strong>Ámbito:</strong> ${d.ambito || '—'} · <strong>Núcleo:</strong> ${d.nucleo || '—'}</div>
        <div class="pf"><strong>OA:</strong> ${oaText}</div>
        <div class="pf"><strong>OAT:</strong> ${oatText}</div>
        <div class="pf" style="margin-top:8px"><strong>Inicio:</strong> ${d.inicio||''}</div>
        <div class="pf"><strong>E1 — ${d.escenario_1_titulo||''}:</strong> ${d.escenario_1_desc||''}</div>
        <div class="pf"><strong>E2 — ${d.escenario_2_titulo||''}:</strong> ${d.escenario_2_desc||''}</div>
        <div class="pf"><strong>E3 — ${d.escenario_3_titulo||''}:</strong> ${d.escenario_3_desc||''}</div>
        <div class="pf" style="margin-top:8px"><strong>Ind. OA 1:</strong> ${d.indicador_oa1||''}</div>
        <div class="pf"><strong>Ind. OA 2:</strong> ${d.indicador_oa2||''}</div>
        <div class="pf"><strong>Ind. OAT:</strong> ${d.indicador_oat||''}</div>
        <div style="margin-top:10px">
          <div class="fam-block"><strong>¿Qué harán los niños?</strong> ${d.que_haran_ninos||''}</div>
          <div class="fam-block"><strong>¿Qué harán las familias?</strong> ${d.que_haran_familias||''}</div>
          <div class="fam-block"><strong>¿Qué necesitamos?</strong> ${d.que_necesitamos||''}</div>
        </div>
      </div>`;
    panelEl.appendChild(panel);
  });

  wrap.style.display = 'block';
  wrap.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Descargar ──
async function descargar(tipo) {
  if (!aiData) { showStatus('status-dl','error','Primero genera el contenido.'); return; }
  const form     = getFormData();
  const btnId    = tipo === 'planificacion' ? 'btn-plan' : tipo === 'familia' ? 'btn-fam' : 'btn-eval';
  const endpoint = tipo === 'planificacion' ? 'download-planificacion' : tipo === 'familia' ? 'download-familia' : 'download-evaluacion';
  const filename = tipo === 'planificacion'
    ? `Planificacion_${form.fecha_inicio}.docx`
    : tipo === 'familia'
    ? `InfoFamilia_${form.fecha_inicio}.docx`
    : `Evaluacion_${form.fecha_inicio}.xlsx`;

  document.getElementById(btnId).disabled = true;
  const labels = {planificacion:'planificación', familia:'info familia', evaluacion:'evaluación'};
  showStatus('status-dl','loading',`<span class="spinner"></span> Generando ${labels[tipo]}...`);

  try {
    const res = await fetch(`${API}/${endpoint}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({form, ai: aiData})
    });
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    showStatus('status-dl','success',`${filename} descargado.`);
  } catch(e) {
    showStatus('status-dl','error','Error: ' + e.message);
  } finally {
    document.getElementById(btnId).disabled = false;
  }
}

function showStatus(id, type, msg) {
  const el = document.getElementById(id);
  el.className = `status-bar ${type}`;
  el.innerHTML = msg;
}

window.addEventListener('DOMContentLoaded', () => {
  buildMatrix();
  const hoy   = new Date();
  const lunes = new Date(hoy);
  lunes.setDate(hoy.getDate() - hoy.getDay() + 1);
  const viernes = new Date(lunes);
  viernes.setDate(lunes.getDate() + 4);
  document.getElementById('fecha-inicio').value = lunes.toISOString().split('T')[0];
  document.getElementById('fecha-fin').value    = viernes.toISOString().split('T')[0];
});
</script>
