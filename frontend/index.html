<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificador Parvularia — Medio Menor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; color: #1a1a2e; min-height: 100vh; }
  header { background: #185FA5; color: white; padding: 18px 32px; }
  header h1 { font-size: 18px; font-weight: 600; }
  header p  { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .container { max-width: 960px; margin: 32px auto; padding: 0 20px; }
  .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 24px; margin-bottom: 20px; }
  .card h2 { font-size: 13px; font-weight: 600; color: #185FA5; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: #64748b; font-weight: 500; }
  .field input, .field select { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; color: #1a1a2e; background: #f8fafc; }
  .field input:focus, .field select:focus { outline: none; border-color: #185FA5; background: white; }
  .day-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .day-tab { padding: 7px 18px; border-radius: 20px; border: 1px solid #cbd5e1; font-size: 13px; cursor: pointer; background: white; color: #64748b; transition: all 0.2s; }
  .day-tab.active { background: #185FA5; color: white; border-color: #185FA5; }
  .day-panel { display: none; }
  .day-panel.active { display: block; }
  .oa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .oa-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 8px; border: 1px solid #e2e8f0; cursor: pointer; background: #f8fafc; transition: all 0.2s; }
  .oa-item:hover { border-color: #185FA5; background: #EFF6FF; }
  .oa-item.selected { border-color: #185FA5; background: #EFF6FF; }
  .oa-item input[type=radio] { margin-top: 2px; flex-shrink: 0; accent-color: #185FA5; }
  .oa-label { font-size: 12px; line-height: 1.4; color: #334155; }
  .oa-num { font-size: 11px; font-weight: 600; color: #185FA5; white-space: nowrap; }
  .section-title { font-size: 12px; font-weight: 600; color: #475569; margin: 14px 0 8px; text-transform: uppercase; letter-spacing: 0.4px; }
  .nucleo-header { grid-column: 1 / -1; font-size: 11px; font-weight: 600; color: #1D9E75; margin-top: 6px; }
  .btn { padding: 11px 20px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 7px; }
  .btn-primary { background: #185FA5; color: white; width: 100%; justify-content: center; }
  .btn-primary:hover { background: #0C447C; }
  .btn-green  { background: #1D9E75; color: white; }
  .btn-green:hover  { background: #0F6E56; }
  .btn-purple { background: #534AB7; color: white; }
  .btn-purple:hover { background: #3C3489; }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .status { margin-top: 14px; padding: 13px 16px; border-radius: 10px; font-size: 13px; display: none; }
  .status.loading { background: #EFF6FF; color: #185FA5; border: 1px solid #B5D4F4; display: block; }
  .status.error   { background: #FEF2F2; color: #A32D2D; border: 1px solid #F7C1C1; display: block; }
  .status.success { background: #E1F5EE; color: #085041; border: 1px solid #9FE1CB; display: block; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #B5D4F4; border-top-color: #185FA5; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .preview-card { background: white; border-radius: 12px; border: 2px solid #1D9E75; padding: 24px; margin-bottom: 20px; display: none; }
  .preview-card h2 { font-size: 14px; font-weight: 600; color: #1D9E75; margin-bottom: 16px; }
  .preview-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .preview-tab { padding: 5px 14px; border-radius: 16px; border: 1px solid #cbd5e1; font-size: 12px; cursor: pointer; background: white; color: #64748b; }
  .preview-tab.active { background: #1D9E75; color: white; border-color: #1D9E75; }
  .preview-panel { display: none; }
  .preview-panel.active { display: block; }
  .preview-day { border-left: 3px solid #ADDB7B; padding-left: 14px; }
  .preview-day h3 { font-size: 13px; font-weight: 600; color: #185FA5; margin-bottom: 8px; }
  .preview-field { margin-bottom: 6px; font-size: 12px; line-height: 1.6; }
  .preview-field strong { color: #334155; }
  .familia-block { padding: 8px 10px; background: #E1F5EE; border-radius: 6px; margin-bottom: 4px; font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <h1>Planificador para Giovanna Marino</h1>
  <p>Educación Parvularia · Nivel Medio Menor · </p>
</header>

<div class="container">

  <div class="card">
    <h2>Datos generales</h2>
    <div class="grid-2">
      <div class="field"><label>Educadora</label><input type="text" id="educadora" value="Giovanna Marino" /></div>
      <div class="field"><label>Técnicos</label><input type="text" id="tecnicos" value="Carol Miranda – Helen Oyarzún" /></div>
    </div>
  </div>

  <div class="card">
    <h2>Semana a planificar</h2>
    <div class="grid-2">
      <div class="field"><label>Desde (Lunes)</label><input type="date" id="fecha-inicio" /></div>
      <div class="field"><label>Hasta (Viernes)</label><input type="date" id="fecha-fin" /></div>
    </div>
  </div>

  <div class="card">
    <h2>Planificación por día</h2>
    <div class="day-tabs">
      <div class="day-tab active" onclick="showDay(0)">Lunes</div>
      <div class="day-tab" onclick="showDay(1)">Martes</div>
      <div class="day-tab" onclick="showDay(2)">Miércoles</div>
      <div class="day-tab" onclick="showDay(3)">Jueves</div>
      <div class="day-tab" onclick="showDay(4)">Viernes</div>
    </div>
    <div id="dias-container"></div>
  </div>

  <div class="card">
    <h2>Paso 1 — Generar contenido</h2>
    <button class="btn btn-primary" onclick="generarPreview()" id="btn-gen">
      Generar planificación con IA
    </button>
    <div class="status" id="status-gen"></div>
  </div>

  <div class="preview-card" id="preview-card">
    <h2>Vista previa — Revisa el contenido antes de descargar</h2>
    <div class="preview-tabs" id="preview-tabs"></div>
    <div id="preview-panels"></div>
    <div style="border-top:1px solid #e2e8f0; padding-top:16px; margin-top:8px;">
      <p style="font-size:12px;color:#64748b;margin-bottom:4px;">Paso 2 — Descarga los documentos</p>
      <div class="btn-row">
        <button class="btn btn-green"  onclick="descargarDocx('planificacion')" id="btn-plan">
          Descargar Planificación .docx
        </button>
        <button class="btn btn-purple" onclick="descargarDocx('familia')" id="btn-fam">
          Descargar Info Familia .docx
        </button>
      </div>
      <div class="status" id="status-dl"></div>
    </div>
  </div>

</div>

<script>
const API = 'https://planificador-parvulos.azurewebsites.net/api';

const OA_BANK = {
  DPS: {
    "Identidad y Autonomía": [
      {num:"OA 1", texto:"Representar verbal y corporalmente diferentes emociones y sentimientos, en sus juegos."},
      {num:"OA 4", texto:"Manifestar disposición para regular sus emociones en función de las necesidades propias y de los demás."},
      {num:"OA 5", texto:"Manifestar sus preferencias cuando participa o solicita participar, en diversas situaciones cotidianas y juegos."},
      {num:"OA 6", texto:"Actuar con progresiva independencia, ampliando su repertorio de acciones acorde a sus necesidades e intereses."},
      {num:"OA 7", texto:"Comunicar algunos rasgos de su identidad, como su nombre, características corporales, género y otros."},
      {num:"OA 9", texto:"Manifestar progresiva independencia en prácticas de alimentación, higiene corporal, bucal y evacuación."},
      {num:"OA 10", texto:"Manifestar satisfacción y confianza por su autovalía, comunicando algunos desafíos alcanzados."},
    ],
    "Convivencia y Ciudadanía": [
      {num:"OA 1", texto:"Participar en actividades y juegos grupales con sus pares, conversando, intercambiando pertenencias, cooperando."},
      {num:"OA 3", texto:"Colaborar en situaciones cotidianas y de juego, proponiendo acciones simples frente a necesidades de sus pares."},
      {num:"OA 6", texto:"Manifestar disposición para practicar acuerdos de convivencia básica que regulan situaciones cotidianas."},
      {num:"OA 8", texto:"Reconocer acciones correctas e incorrectas para la convivencia armónica del grupo."},
      {num:"OA 10", texto:"Manifestar interés para interactuar con niños y niñas, reconociendo la diversidad de sus características."},
    ],
    "Corporalidad y Movimiento": [
      {num:"OA 2", texto:"Reconocer las principales partes, características físicas de su cuerpo y sus funciones."},
      {num:"OA 3", texto:"Experimentar diversas posibilidades de acción con su cuerpo."},
      {num:"OA 5", texto:"Perfeccionar su coordinación visomotriz fina, a través del uso de diversos objetos, juguetes y utensilios."},
      {num:"OA 6", texto:"Adquirir control y equilibrio en movimientos, posturas y desplazamientos."},
      {num:"OA 7", texto:"Resolver desafíos prácticos en situaciones cotidianas y juegos, incorporando mayor precisión y coordinación."},
    ]
  },
  CI: {
    "Lenguaje Verbal": [
      {num:"OA 1", texto:"Expresarse oralmente, empleando estructuras oracionales simples y respetando patrones gramaticales básicos."},
      {num:"OA 2", texto:"Comprender mensajes simples como instrucciones explícitas, explicaciones y preguntas."},
      {num:"OA 4", texto:"Incorporar progresivamente nuevas palabras al comunicar oralmente temas variados de su interés."},
      {num:"OA 6", texto:"Comprender, a partir de la escucha atenta, contenidos explícitos de textos literarios y no literarios."},
    ],
    "Lenguajes Artísticos": [
      {num:"OA 3", texto:"Interpretar canciones y juegos musicales, experimentando con diversos recursos (voz, cuerpo, instrumentos)."},
      {num:"OA 4", texto:"Expresar corporalmente sensaciones y emociones experimentando con mímica, juegos teatrales, rondas y danzas."},
      {num:"OA 5", texto:"Expresar emociones, ideas y experiencias por medio de la plástica experimentando con recursos pictóricos y de modelado."},
      {num:"OA 7", texto:"Representar a través del dibujo diversos elementos de su entorno, incorporando figuras cerradas y primeros esbozos de la figura humana."},
    ]
  },
  ICE: {
    "Exploración del Entorno Natural": [
      {num:"OA 1", texto:"Manifestar interés y asombro por diversos elementos, situaciones y fenómenos del entorno natural."},
      {num:"OA 2", texto:"Comunicar verbalmente características de elementos y paisajes de su entorno natural."},
      {num:"OA 4", texto:"Comunicar algunas propiedades básicas de los elementos naturales que explora (colores, texturas, tamaños)."},
      {num:"OA 5", texto:"Distinguir una variedad de animales y plantas respecto a sus características, necesidades básicas y lugares que habitan."},
      {num:"OA 6", texto:"Colaborar en acciones que contribuyen al desarrollo de ambientes sostenibles."},
    ],
    "Comprensión del Entorno Sociocultural": [
      {num:"OA 1", texto:"Describir actividades habituales de su comunidad (ir de compras, jugar en la plaza, viajar en bus)."},
      {num:"OA 4", texto:"Reconocer sucesos significativos de su historia personal y familiar."},
      {num:"OA 6", texto:"Identificar algunas normas de protección y seguridad de su entorno cotidiano."},
    ],
    "Pensamiento Matemático": [
      {num:"OA 1", texto:"Reproducir patrones sonoros, visuales, gestuales, corporales u otros, de dos o tres elementos."},
      {num:"OA 5", texto:"Emplear cuantificadores tales como más/menos, mucho/poco, todo/ninguno, al comparar cantidades de objetos."},
      {num:"OA 6", texto:"Emplear progresivamente los números para contar, identificar, cuantificar y comparar cantidades hasta el 10."},
    ]
  }
};

const OAT_LIST = [
  {num:"IA OA 4", texto:"Manifestar disposición para regular sus emociones en función de las necesidades propias y de los demás.", nucleo:"Identidad y Autonomía"},
  {num:"IA OA 5", texto:"Manifestar sus preferencias cuando participa en diversas situaciones cotidianas y juegos.", nucleo:"Identidad y Autonomía"},
  {num:"CC OA 1", texto:"Participar en actividades y juegos grupales, conversando, intercambiando pertenencias y cooperando.", nucleo:"Convivencia y Ciudadanía"},
  {num:"CC OA 6", texto:"Manifestar disposición para practicar acuerdos de convivencia básica que regulan situaciones cotidianas.", nucleo:"Convivencia y Ciudadanía"},
  {num:"CC OA 8", texto:"Reconocer acciones correctas e incorrectas para la convivencia armónica del grupo.", nucleo:"Convivencia y Ciudadanía"},
  {num:"CC OA 10", texto:"Manifestar interés para interactuar con niños y niñas, reconociendo la diversidad de sus características.", nucleo:"Convivencia y Ciudadanía"},
  {num:"CM OA 3", texto:"Experimentar diversas posibilidades de acción con su cuerpo.", nucleo:"Corporalidad y Movimiento"},
];

const DIAS      = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
const DIAS_KEYS = ['lunes','martes','miercoles','jueves','viernes'];
const AMBITOS   = {DPS:'Desarrollo Personal y Social', CI:'Comunicación Integral', ICE:'Interacción y Comprensión del Entorno'};

let selectedOA = [null,null,null,null,null];
let selectedOAT= [null,null,null,null,null];
let aiData     = null;

function buildDayPanels() {
  const container = document.getElementById('dias-container');
  DIAS.forEach((nombre, i) => {
    const panel = document.createElement('div');
    panel.className = 'day-panel' + (i === 0 ? ' active' : '');
    panel.id = `panel-${i}`;
    panel.innerHTML = `
      <div class="grid-2" style="margin-bottom:12px">
        <div class="field">
          <label>Tema del día</label>
          <input type="text" id="tema-${i}" placeholder="Ej: Hábitos de higiene" oninput="resetPreview()">
        </div>
        <div class="field">
          <label>Ámbito</label>
          <select id="ambito-${i}" onchange="renderOA(${i}); resetPreview()">
            <option value="DPS">Desarrollo Personal y Social</option>
            <option value="CI">Comunicación Integral</option>
            <option value="ICE">Interacción y Comprensión del Entorno</option>
          </select>
        </div>
      </div>
      <div class="section-title">OA Principal</div>
      <div class="oa-grid" id="oa-grid-${i}"></div>
      <div class="section-title">OAT (Transversal)</div>
      <div class="oa-grid" id="oat-grid-${i}"></div>`;
    container.appendChild(panel);
  });
}

function renderOA(day) {
  const ambitoKey = document.getElementById(`ambito-${day}`).value;
  const nucleos   = OA_BANK[ambitoKey];
  const grid      = document.getElementById(`oa-grid-${day}`);
  grid.innerHTML  = '';
  selectedOA[day] = null;

  Object.entries(nucleos).forEach(([nucleo, oas]) => {
    const hdr = document.createElement('div');
    hdr.className = 'nucleo-header';
    hdr.textContent = nucleo;
    grid.appendChild(hdr);
    oas.forEach(oa => {
      const item = document.createElement('div');
      item.className = 'oa-item';
      item.innerHTML = `<input type="radio" name="oa-${day}" value="${nucleo}||${oa.num}||${oa.texto}">
        <div><div class="oa-num">${oa.num}</div><div class="oa-label">${oa.texto}</div></div>`;
      item.querySelector('input').addEventListener('change', function() {
        grid.querySelectorAll('.oa-item').forEach(el => el.classList.remove('selected'));
        item.classList.add('selected');
        const p = this.value.split('||');
        selectedOA[day] = {nucleo:p[0], num:p[1], texto:p[2]};
        resetPreview();
      });
      grid.appendChild(item);
    });
  });

  const oatGrid     = document.getElementById(`oat-grid-${day}`);
  oatGrid.innerHTML = '';
  selectedOAT[day]  = null;
  OAT_LIST.forEach(oat => {
    const item = document.createElement('div');
    item.className = 'oa-item';
    item.innerHTML = `<input type="radio" name="oat-${day}">
      <div><div class="oa-num" style="color:#854F0B">${oat.num}</div><div class="oa-label">${oat.texto}</div></div>`;
    item.querySelector('input').addEventListener('change', () => {
      oatGrid.querySelectorAll('.oa-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      selectedOAT[day] = oat;
      resetPreview();
    });
    oatGrid.appendChild(item);
  });
}

function showDay(idx) {
  document.querySelectorAll('.day-tab').forEach((t,i)   => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.day-panel').forEach((p,i) => p.classList.toggle('active', i === idx));
}

function getFormData() {
  return {
    educadora:    document.getElementById('educadora').value,
    tecnicos:     document.getElementById('tecnicos').value,
    fecha_inicio: document.getElementById('fecha-inicio').value,
    fecha_fin:    document.getElementById('fecha-fin').value,
    dias: DIAS.map((nombre, i) => ({
      nombre,
      tema:   document.getElementById(`tema-${i}`).value,
      ambito: AMBITOS[document.getElementById(`ambito-${i}`).value],
      oa:     selectedOA[i],
      oat:    selectedOAT[i]
    }))
  };
}

function validate() {
  const data = getFormData();
  if (!data.fecha_inicio || !data.fecha_fin) return 'Selecciona las fechas de la semana.';
  for (let i = 0; i < 5; i++) {
    if (!data.dias[i].tema)  return `Falta el tema del ${DIAS[i]}.`;
    if (!selectedOA[i])      return `Selecciona un OA para el ${DIAS[i]}.`;
    if (!selectedOAT[i])     return `Selecciona un OAT para el ${DIAS[i]}.`;
  }
  return null;
}

function resetPreview() {
  aiData = null;
  document.getElementById('preview-card').style.display = 'none';
}

async function generarPreview() {
  const err = validate();
  if (err) { showStatus('status-gen','error', err); return; }

  const form = getFormData();
  document.getElementById('btn-gen').disabled = true;
  showStatus('status-gen','loading','<span class="spinner"></span> Generando contenido con IA... esto toma unos segundos.');
  document.getElementById('preview-card').style.display = 'none';

  try {
    const res = await fetch(`${API}/generate`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(form)
    });
    if (!res.ok) throw new Error(await res.text());
    const json = await res.json();
    aiData = json.data;
    renderPreview(form, aiData);
    showStatus('status-gen','success','Contenido generado. Revisa la vista previa y descarga los documentos.');
  } catch(e) {
    showStatus('status-gen','error','Error: ' + e.message);
  } finally {
    document.getElementById('btn-gen').disabled = false;
  }
}

function renderPreview(form, ai) {
  const card    = document.getElementById('preview-card');
  const tabsEl  = document.getElementById('preview-tabs');
  const panelEl = document.getElementById('preview-panels');
  tabsEl.innerHTML  = '';
  panelEl.innerHTML = '';

  DIAS.forEach((nombre, i) => {
    const key = DIAS_KEYS[i];
    const d   = ai[key] || {};
    const fd  = form.dias[i];

    const tab = document.createElement('div');
    tab.className = 'preview-tab' + (i === 0 ? ' active' : '');
    tab.textContent = nombre;
    tab.onclick = () => {
      tabsEl.querySelectorAll('.preview-tab').forEach((t,j)   => t.classList.toggle('active', j === i));
      panelEl.querySelectorAll('.preview-panel').forEach((p,j) => p.classList.toggle('active', j === i));
    };
    tabsEl.appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'preview-panel' + (i === 0 ? ' active' : '');
    panel.innerHTML = `
      <div class="preview-day">
        <h3>${d.titulo_dia || nombre + ': ' + fd.tema}</h3>
        <div class="preview-field"><strong>OA:</strong> ${fd.oa?.num} — ${fd.oa?.texto}</div>
        <div class="preview-field"><strong>OAT:</strong> ${fd.oat?.num} — ${fd.oat?.texto}</div>
        <div class="preview-field" style="margin-top:8px"><strong>Inicio:</strong> ${d.inicio||''}</div>
        <div class="preview-field"><strong>E1 — ${d.escenario_1_titulo||''}:</strong> ${d.escenario_1_desc||''}</div>
        <div class="preview-field"><strong>E2 — ${d.escenario_2_titulo||''}:</strong> ${d.escenario_2_desc||''}</div>
        <div class="preview-field"><strong>E3 — ${d.escenario_3_titulo||''}:</strong> ${d.escenario_3_desc||''}</div>
        <div class="preview-field" style="margin-top:8px"><strong>Ind. OA 1:</strong> ${d.indicador_oa1||''}</div>
        <div class="preview-field"><strong>Ind. OA 2:</strong> ${d.indicador_oa2||''}</div>
        <div class="preview-field"><strong>Ind. OAT:</strong> ${d.indicador_oat||''}</div>
        <div style="margin-top:10px">
          <div class="familia-block"><strong>¿Qué harán los niños?</strong> ${d.que_haran_ninos||''}</div>
          <div class="familia-block"><strong>¿Qué harán las familias?</strong> ${d.que_haran_familias||''}</div>
          <div class="familia-block"><strong>¿Qué necesitamos?</strong> ${d.que_necesitamos||''}</div>
        </div>
      </div>`;
    panelEl.appendChild(panel);
  });

  card.style.display = 'block';
  card.scrollIntoView({behavior:'smooth', block:'start'});
}

async function descargarDocx(tipo) {
  if (!aiData) { showStatus('status-dl','error','Primero genera el contenido.'); return; }

  const form     = getFormData();
  const btnId    = tipo === 'planificacion' ? 'btn-plan' : 'btn-fam';
  const endpoint = tipo === 'planificacion' ? 'download-planificacion' : 'download-familia';
  const filename = tipo === 'planificacion'
    ? `Planificacion_${form.fecha_inicio}.docx`
    : `InfoFamilia_${form.fecha_inicio}.docx`;

  document.getElementById(btnId).disabled = true;
  showStatus('status-dl','loading',`<span class="spinner"></span> Generando ${tipo === 'planificacion' ? 'planificación' : 'info familia'}...`);

  try {
    const res = await fetch(`${API}/${endpoint}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({form, ai: aiData})
    });
    if (!res.ok) throw new Error(await res.text());

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    showStatus('status-dl','success',`${filename} descargado correctamente.`);
  } catch(e) {
    showStatus('status-dl','error','Error: ' + e.message);
  } finally {
    document.getElementById(btnId).disabled = false;
  }
}

function showStatus(id, type, msg) {
  const el = document.getElementById(id);
  el.className = `status ${type}`;
  el.innerHTML = msg;
}

window.addEventListener('DOMContentLoaded', () => {
  buildDayPanels();
  [0,1,2,3,4].forEach(i => renderOA(i));
  const hoy     = new Date();
  const lunes   = new Date(hoy);
  lunes.setDate(hoy.getDate() - hoy.getDay() + 1);
  const viernes = new Date(lunes);
  viernes.setDate(lunes.getDate() + 4);
  document.getElementById('fecha-inicio').value = lunes.toISOString().split('T')[0];
  document.getElementById('fecha-fin').value    = viernes.toISOString().split('T')[0];
});
</script>
</body>
